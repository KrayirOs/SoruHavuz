<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soru Getir</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="container"><nav class="top-nav" aria-label="Ana gezinme">
  <a href="index.html" data-nav="index.html" aria-label="Ana sayfa"><span class="nav-icon">⌂</span><span class="nav-label">Ana</span></a><a href="liste.html" data-nav="liste.html" aria-label="Sorular"><span class="nav-icon">☰</span><span class="nav-label">Sorular</span></a><a href="tekrar.html" data-nav="tekrar.html" aria-label="Tekrar"><span class="nav-icon">↻</span><span class="nav-label">Tekrar</span></a><a href="ekle.html" data-nav="ekle.html" class="nav-add" aria-label="Soru veya bilgi ekle"><span class="nav-icon">＋</span><span class="nav-label">Ekle</span></a><div class="nav-more-wrap"><button type="button" class="nav-more-btn" aria-expanded="false" aria-controls="navMoreMenu"><span class="nav-icon">•••</span><span class="nav-label">Daha</span></button><div class="nav-more-menu" id="navMoreMenu" hidden><a class="nav-more-link" href="retrieval.html" data-nav="retrieval.html">Soru Getir</a><a class="nav-more-link" href="statistics.html" data-nav="statistics.html">İstatistik</a><a class="nav-more-link" href="notes.html" data-nav="notes.html">Notlar</a><a class="nav-more-link" href="curriculum.html" data-nav="curriculum.html">Kazanımlar</a><a class="nav-more-link" href="import.html" data-nav="import.html">İçe Aktar</a><a class="nav-more-link" href="settings.html" data-nav="settings.html">Ayarlar</a></div></div></nav>
<section class="panel"><h1>Soru Getir</h1><p class="small">Kategori ve tercihlerini seç; sistem uygun soruları getirir.</p><div class="grid two"><div><label>Kategori</label><select id="category"></select></div><div><label>Soru tipi</label><select id="questionType"><option value="">Fark etmez</option></select></div><div><label>Minimum zorluk</label><select id="difficultyMin"><option value="">Fark etmez</option><option value="1">1 — Çok Kolay</option><option value="2">2 — Kolay</option><option value="3">3 — Orta</option><option value="4">4 — Zor</option><option value="5">5 — Çok Zor</option></select></div><div><label>Maksimum zorluk</label><select id="difficultyMax"><option value="">Fark etmez</option><option value="1">1 — Çok Kolay</option><option value="2">2 — Kolay</option><option value="3">3 — Orta</option><option value="4">4 — Zor</option><option value="5">5 — Çok Zor</option></select></div><div><label>Çözülmüş sorular</label><select id="solvedPolicy"><option value="exclude">Çözülmemişleri getir</option><option value="include">Hepsini getir</option><option value="prefer_unsolved">Çözülmemişlere öncelik ver</option></select></div><div><label>Kaç soru?</label><select id="limit"><option value="10">10</option><option value="20" selected>20</option><option value="50">50</option><option value="100">100</option><option value="all">Tümü</option></select></div></div><div><label for="text">Ek arama metni</label><input id="text" placeholder="Örn. grafik, türev, hız problemi"></div><div class="actions"><button id="search">Soruları Getir</button><button id="clear" class="secondary">Temizle</button></div><div id="status" class="status info">Hazır.</div></section><section class="panel"><div id="summary" class="small"></div><div id="results" class="list"></div></section></main>
<script type="module">
import { bootPage } from './js/common.js'; import { initDB } from './js/db/dexie-db.js'; import { createBrowserQuestionRetrievalService } from './js/retrieval/browser-service.js'; import { QUESTION_TYPES } from './js/questions/question-config.js'; import { listCategories, migrateLegacyCategories } from './js/categories/category-repo.js';
const $=id=>document.getElementById(id), service=createBrowserQuestionRetrievalService();
async function loadCategories(){const current=$('category').value;$('category').replaceChildren(new Option('Tüm kategoriler',''));for(const c of await listCategories())$('category').add(new Option(c.name,String(c.id)));$('category').value=current;}
for(const t of QUESTION_TYPES)$('questionType').add(new Option(t.label,t.id));
$('clear').onclick=()=>{for(const id of ['category','questionType','difficultyMin','difficultyMax'])$(id).value='';$('solvedPolicy').value='exclude';$('limit').value='20';$('text').value='';$('results').replaceChildren();$('summary').textContent='';};
$('search').onclick=async()=>{try{$('status').textContent='Sorular hazırlanıyor…';const response=await service.retrieve({categoryId:$('category').value||null,questionTypes:$('questionType').value?[$('questionType').value]:[],difficulty:{min:$('difficultyMin').value||null,max:$('difficultyMax').value||null},solvedPolicy:$('solvedPolicy').value,queryText:$('text').value,limit:$('limit').value==='all'?null:Number($('limit').value),diversity:.35});$('summary').textContent=`${response.resultCount} soru getirildi · ${response.candidateCount} eşleşen aday`;const cards=response.results.map(item=>{const el=document.createElement('article');el.className='question-card';el.innerHTML=`<strong>#${item.questionId}</strong>${item.question?.category?.name?` · ${item.question.category.name}`:''}<div>${item.question?.question?.content?.text||'(sadece görsel)'}</div><div class="small">${item.reasons.join(' · ')||'Filtre uyumu'}</div>`;return el;});$('results').replaceChildren(...cards);$('status').textContent=response.resultCount?'Sonuçlar hazır.':'Bu seçimde soru bulunamadı.';}catch(error){$('status').textContent=error.message||'Getirme başarısız.';}};
await bootPage();await initDB();await migrateLegacyCategories();await loadCategories();
</script></body></html>
