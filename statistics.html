</nav><section class="panel"><header class="page-head"><h1>İstatistikler</h1><p class="small">Gerçek çözüm geçmişinden hesaplanır; AI veya tahmin içermez.</p></header><div class="kpi" id="kpi"></div></section><section class="panel"><h2>Ders bazında</h2><div id="subjects" class="list"></div></section></main><script type="module">import {bootPage} from './js/common.js'; import {db,initDB} from './js/db/dexie-db.js'; import {buildStatistics} from './js/statistics/statistics-service.js'; await bootPage(); await initDB(); const [q,n]=await Promise.all([db.questions.toArray(),db.notes.toArray()]); const s=buildStatistics(q,n); document.getElementById('kpi').innerHTML=`<article class="kpi-item"><span>Toplam Soru</span><strong>${s.totalQuestions}</strong></article><article class="kpi-item"><span>Çözülmüş Soru</span><strong>${s.solvedQuestions}</strong></article><article class="kpi-item"><span>Toplam Çözüm</span><strong>${s.attempts}</strong></article><article class="kpi-item"><span>Doğruluk</span><strong>${Math.round(s.accuracy*100)}%</strong></article><article class="kpi-item"><span>Bugün Tekrar</span><strong>${s.dueToday}</strong></article><article class="kpi-item"><span>Bilgi Notu</span><strong>${s.totalNotes}</strong></article>`; const root=document.getElementById('subjects'); if(!s.subjects.length){root.textContent='Henüz çözüm kaydı yok.';} else root.replaceChildren(...s.subjects.map(x=>{const el=document.createElement('article');el.className='question-card';const acc=x.attempts?Math.round(x.correct/x.attempts*100):0;el.innerHTML=`<strong>${x.subject}</strong><div class="small">${x.total} soru · ${x.solved} çözülmüş · ${x.attempts} çözüm · ${acc}% doğruluk</div>`;return el;}));</script></body></html>
