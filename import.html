</nav><section class="panel"><h1>Toplu soru içe aktarma</h1><p class="small">JSON veya CSV seçin. Önizleme, siz onaylamadan soru kaydetmez.</p><input id="file" type="file" accept=".json,.csv,application/json,text/csv"><div class="actions"><button id="preview" disabled>Önizle</button><button id="commit" class="secondary" disabled>İçe aktar</button><button id="cancel" class="secondary" disabled>İptal</button></div><div id="status" class="status info">Dosya bekleniyor.</div><pre id="summary" class="small"></pre></section></main><script type="module">
import { bootPage } from './js/common.js'; import { initDB, db } from './js/db/dexie-db.js'; import { CurriculumRepository } from './js/curriculum/repository/curriculum-repository.js'; import { ImportRepository, ImportJobService, ImportValidator, DuplicateService } from './js/imports/index.js';
const file=document.querySelector('#file'), previewButton=document.querySelector('#preview'), commit=document.querySelector('#commit'), cancel=document.querySelector('#cancel'), status=document.querySelector('#status'), summary=document.querySelector('#summary'); let preview, controller;
const message=(text,type='info')=>{status.textContent=text;status.className=`status ${type}`}; await bootPage(); await initDB(); const repository=new ImportRepository(db), curriculum=new CurriculumRepository(db), service=new ImportJobService({ validator:new ImportValidator(curriculum), duplicates:new DuplicateService(repository), repository });
file.addEventListener('change',()=>previewButton.disabled=!file.files[0]); previewButton.addEventListener('click',async()=>{try{const selected=file.files[0], type=selected.name.toLowerCase().endsWith('.csv')?'csv':'json';message('Önizleme hazırlanıyor…');preview=await service.preview({text:await selected.text(),fileName:selected.name,fileType:type});summary.textContent=`Toplam: ${preview.totalRecords}\nGeçerli: ${preview.validRecords}\nHatalı: ${preview.invalidRecords}\nExact duplicate: ${preview.duplicateRecords}\nİçe aktarılacak soru: ${preview.validRecords}`;commit.disabled=!preview.validRecords;message('Önizleme hazır.','success')}catch(error){message(error.message||'Dosya okunamadı.','error')}}); commit.addEventListener('click',async()=>{controller=new AbortController();cancel.disabled=false;commit.disabled=true;try{const result=await service.start(preview,{signal:controller.signal,onProgress:(p)=>message(`Kaydediliyor: ${p.completed}/${p.total}`)});message(result.status==='cancelled'?'İçe aktarma iptal edildi.':`${result.importedRecords} taslak soru içe aktarıldı; sorular kaydedildi.`,result.status==='cancelled'?'info':'success')}catch(error){message(error.message||'İçe aktarma başarısız.','error')}finally{cancel.disabled=true}});cancel.addEventListener('click',()=>controller?.abort());
</script></body></html>
