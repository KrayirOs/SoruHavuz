    <section class="panel dashboard-hero">
      <header class="page-head">
        <span class="eyebrow">BUGÜN</span>
        <h1>Ne çalışacaksın?</h1>
        <p class="small">Sorunu çöz, tekrarını yap veya yeni bir soru ekle.</p>
      </header>
      <div class="kpi" id="kpi"></div>
      <section class="today-review" id="todayReview"></section>
      <div class="quick-actions" aria-label="Hızlı işlemler">
        <a class="button-link" href="liste.html">Sorulara Git</a>
        <a class="button-link secondary-link" href="ekle.html">＋ Soru Ekle</a>
        <a class="button-link secondary-link" href="tekrar.html">↻ Tekrar</a>
      </div>
    </section>


  </div>

  <script type="module">
    import { bootPage } from "./js/common.js";
    import { initDB } from "./js/db/dexie-db.js";
    import { countQuestions } from "./js/questions/question-repo.js";
    import { db } from "./js/db/dexie-db.js";
    import { localDateStr, isDue } from "./js/srs/srs.js";

    const kpi = document.getElementById("kpi");

    async function init() {
      await bootPage();
      await initDB();

      const total = await countQuestions();
      const today = localDateStr();
      const [questions, notes] = await Promise.all([db.questions.toArray(), db.notes.toArray()]);
      const dueQuestions = questions.filter(q => isDue(q, today)).length;
      const dueNotes = notes.filter(n => isDue(n, today)).length;
      const due = dueQuestions + dueNotes;
      const attempts = questions.reduce((sum,q)=>sum + Number(q.statistics?.correct||0) + Number(q.statistics?.wrong||0) + Number(q.statistics?.blank||0),0);
      const correct = questions.reduce((sum,q)=>sum + Number(q.statistics?.correct||0),0);
      kpi.innerHTML = `
        <article class="kpi-item"><span>Toplam Soru</span><strong>${total}</strong></article>
        <article class="kpi-item"><span>Bugün Tekrar</span><strong>${due}</strong><span class="kpi-sub">${dueQuestions} soru · ${dueNotes} bilgi</span></article>
        <article class="kpi-item"><span>Başarı</span><strong>${attempts ? Math.round(correct / attempts * 100) : 0}%</strong><span class="kpi-sub">${attempts} çözüm</span></article>
      `;
      const review = document.getElementById("todayReview");
      review.innerHTML = due ? `<div><strong>Bugün Tekrar Etmem Gerekenler</strong><p class="small">${dueQuestions} soru ve ${dueNotes} bilgi notu tekrar bekliyor.</p></div><a class="button-link" href="tekrar.html">Tekrara Başla →</a>` : `<div><strong>Bugün tekrar bekleyen bir şey yok.</strong><p class="small">Yeni eklediğin soru ve bilgiler SRS ile otomatik takvime girer.</p></div><a class="button-link" href="ekle.html">Yeni Ekle →</a>`;
    }

    init().catch((error) => {
      console.error(error);
    });
  </script>
</body>
